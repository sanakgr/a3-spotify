@if (popularity) {
  <div class="progress" role="progressbar" [attr.aria-label]="label" [attr.aria-valuenow]="popularity.percent * 100" aria-valuemin="0" aria-valuemax="100">
    <div class="progress-bar" [style.width]="popularity.percentageString" [style.background-color]="popularity.color">
      <span class="progress-bar-text">{{ label }}: {{ popularity.percentageString }}</span>
    </div>
  </div>
}
