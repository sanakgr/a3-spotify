<h1>Search Spotify</h1>
<input type="text" [(ngModel)]="searchString" (keyup.enter)="search()" aria-label="Search Spotify">
<select [(ngModel)]="searchCategory" aria-label="Search category">
  @for (category of searchCategories; track category) {
    <option [value]="category">{{ category }}</option>
  }
</select>
<button class="btn btn-light" (click)="search()">Search</button>
@if (displayCategory === 'artist' || displayCategory === 'album') {
  <app-carousel [resources]="resources" carouselId="searchCarousel"></app-carousel>
}
@if (displayCategory === 'track') {
  <app-track-list [tracks]="tracks"></app-track-list>
}
