<button class="btn btn-light" (click)="loadInfo()">Load info about me</button>
<h3>Logged in user: {{ name }}</h3>
<img [src]="profile_pic" [alt]="name + ' profile picture'" class="profile">
<p>
  <a class="btn btn-light" [href]="profile_link" target="_blank" rel="noopener noreferrer">Open profile on Spotify</a>
</p>
